name = "Edit dependencies in the web modal"
status = "done"
owner = "claude"
description = """
Card dependencies (blocked_by) can only be set from the CLI. Add a 'Blocked by' field to the web board's card modal (create and edit).

- Shows current blockers as removable chips; an input with autocomplete over existing card names adds more (Enter or picking a suggestion).
- Server validates newly added blockers with dependencies::resolve_blocker (unknown names, self-blocking and cycles are rejected and the error shows in the modal). Blockers already on the card are kept as-is even if that card has since been deleted.
- Time machine mode shows the chips read-only."""
