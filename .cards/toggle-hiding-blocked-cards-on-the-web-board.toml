name = "Toggle hiding blocked cards on the web board"
status = "done"
owner = "claude"
description = """
Cards waiting on an unfinished blocker can't be picked up, and they clutter the board. Add a toggle to hide them.

- Header button 'Hide blocked (N)' / 'Show blocked (N)', keyboard shortcut b, listed in the shortcuts panel.
- Choice remembered in localStorage across reloads (the board reloads on every change).
- Keyboard navigation skips hidden cards. Works in time machine mode too."""
