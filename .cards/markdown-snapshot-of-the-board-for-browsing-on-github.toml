name = "markdown snapshot of the board for browsing on GitHub"
status = "done"
description = """
Someone browsing a cardthing repo on GitHub (or any forge) can't see where things are at without cloning and running `cardthing list` or `cardthing serve`. Keep a committed, human-readable markdown snapshot of the board in the repo, so a glance at the repo shows the current cards. The information is redundant on purpose. A long Done section is also a visible nudge to clear out old cards.

## Where and when

- The path is set by a new optional `snapshot` key in `.cards.toml`, e.g. `snapshot = ".cards/README.md"`. If the key is missing, no snapshot is written (existing repos are unaffected). `.cards/README.md` is a good default because GitHub renders it when you open `.cards/`. Make sure a `README.md` inside `.cards/` is never read as a card: list_cards should only load `*.toml`, so check that it already does.
- Regenerate it on every write, not in a commit hook. jj has no hooks and cards also change through `cardthing serve` and `cardthing work`. The choke points are `save_card` and `delete_card` in src/storage/cards.rs. Rebuild it from the full card list each time (never patch it). Write to a temp file and rename it into place so concurrent writers never leave a half-written file.
- Add `cardthing snapshot` to regenerate it on demand, e.g. after hand-editing TOML. With no `snapshot` key, it says so and exits non-zero.
- Have `cardthing init` set `snapshot = ".cards/README.md"` in the config it generates. The "init sets up agent skills" card also changes init, so check what's already there.

## Content

- The board title as an H1, then one section per status, in `.cards.toml` order, with the card count in the heading, e.g. `## Todo (3)`. Show empty statuses with `_none_`.
- Within a status, order cards the same way `cardthing list` does (by `order`, then the existing fallback).
- One bullet per card: the name, linked to its TOML file with a relative link so it works on GitHub, then any of owner, priority, tags and due date that are set, and 🔒 plus the blocker names if it's blocked by unfinished cards.
- List every card, including all done cards, with no truncation. The point is that hoarding shows.
- Make the output deterministic: no "generated at" timestamp and no updated times. That way the file only changes in a diff when the board changes, and commits don't get churn.
- Start the file with a one-line comment saying it's generated by cardthing and shouldn't be edited by hand.

## Done when

- With `snapshot` set, `add`, `edit`, `append`, `checklist`, `rm`, a web board edit and a worker status change all update the file.
- Without `snapshot`, nothing is written.
- Running `cardthing snapshot` twice in a row gives byte-identical output.
- Tests cover the rendering (sections, counts, ordering, blocked marker, links) and the on/off config.
- This repo's `.cards.toml` sets `snapshot = ".cards/README.md"`, and the generated file is committed."""
